name: Release APK

# Build Nebula.apk and attach it to the GitHub release whenever a v* tag
# is pushed (e.g. `git tag v2.2 && git push origin v2.2`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-23" "build-tools;30.0.3"

      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Nebula.apk --clobber
          else
            gh release create "$TAG" Nebula.apk \
              --title "Nebula $TAG" \
              --notes "Automated build for $TAG."
          fi
