name: Sync F-Droid metadata mirror

# fdroiddata-metadata.yml mirrors the canonical F-Droid build metadata
# (fdroid/fdroiddata master). After a release, the F-Droid checkupdates
# bot updates upstream on its own schedule; this job keeps the in-repo
# mirror in sync so releases need no manual follow-up visit.
#
# This workflow intentionally never builds or uploads anything, and no CI
# workflow here may upload APK assets. In v4.8.0 a release.yml workflow
# auto-created the GitHub release on tag push and attached a DEBUG-signed
# APK, racing the maintainer's verified release-signed upload; F-Droid
# rejects a build whose signer cert does not match. That workflow was
# deleted 2026-07-04 and must not come back.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream metadata
        run: |
          curl -sf "https://gitlab.com/api/v4/projects/fdroid%2Ffdroiddata/repository/files/metadata%2Fcom.jordanadema.nebula.yml/raw?ref=master" \
            -o fdroiddata-metadata.yml

      - name: Commit if changed
        run: |
          if ! git diff --quiet fdroiddata-metadata.yml; then
            VER=$(awk '/^CurrentVersion:/{print $2}' fdroiddata-metadata.yml)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fdroiddata-metadata.yml
            git commit -m "Sync fdroiddata metadata (upstream CurrentVersion $VER)"
            git push
          else
            echo "Mirror already in sync."
          fi
